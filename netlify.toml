# Static publish — matches current Netlify site (no Vite build step).
# Logos live at /public/assets/*

[build]
  command = "echo 'static publish'"
  publish = "."

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[headers]]
  for = "/public/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
