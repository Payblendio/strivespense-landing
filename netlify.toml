{
  "$schema": "https://json.schemastore.org/netlify.json",
  "build": {
    "command": "npm run build",
    "publish": "dist"
  },
  "redirects": [
    {
      "from": "/privacy",
      "to": "/privacy.html",
      "status": 200
    }
  ],
  "headers": [
    {
      "for": "/assets/*",
      "values": {
        "Cache-Control": "public, max-age=31536000, immutable"
      }
    }
  ]
}
